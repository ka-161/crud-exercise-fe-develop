<div class="container mt-4">
    <!-- TODO: check out extension: TODO highlight -->
    <!-- TODO: make font-color black -->
    <h2 class="bg-warning p-2 fw-bold text-center">Task Manager App</h2>

    <div class="row">
        <div class="col-4">
            <div class="row">
                <div class="col-6 ">
                    <h3 class="fw-bold float-start">Task List</h3>
                </div>
                <div class="col-6 ">
                    <!-- TODO: position button - gpt says its because of float and should use flex instead...-->
                    <button type="button" class="btn btn-secondary float-end">Add New TaskList</button>
                </div>
                <div class="row">
                    <div class="col-12">

                        <ul class="list-group">
                             <!-- TODO: position items, 100 percent or swomething, to align with gloat end -->
                           <li *ngFor = "let item of taskLists" class="list-group-item d-flex justify-content-between align-items-center">
                             {{item.title}}
                            <span class="badge bg-danger rounded-pill">X</span>
                            </li>
                        </ul>
                    </div>



                </div>
            </div>
        </div>

        <div class="col-8">

            <div class="row">
                <div class="col-6 ">
                    <h3 class="fw-bold float-start">Linked Tasks</h3>
                </div>
                <div class="col-6  ">
                    <button type="button" class="btn btn-secondary float-end">Add New Task</button>
                </div>
                <div class="row">
                    <div class="col-12">

                        <ul class="list-group">
                                                <!-- TODO: position items, 100 percent or swomething, to align with gloat end -->
<!--                                got these from https://getbootstrap.com/docs/5.0/components/list-group/-->
                            <li *ngFor="let item of tasks" class="list-group-item d-flex justify-content-between align-items-center">
                                {{item.title}}
                                <span class="badge bg-danger rounded-pill">X</span>
                            </li>
                        </ul>
                    </div>



                </div>
            </div>
        </div>

    </div>
